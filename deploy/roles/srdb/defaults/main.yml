---
srdb_install_dir: /opt/srdb
srdb_env_dir: "{{ srdb_install_dir }}/env"
srdb_data_dir: /var/lib/srdb
srdb_html_dir: /var/www/srdb
srdb_service_user: srdb
srdb_service_group: srdb

# Domain Caddy will obtain a TLS certificate for.
srdb_domain: "srdb.thath.net"

# Port uvicorn listens on (Caddy proxies to this).
srdb_server_port: 8000

# Local path to the pixi-pack self-extracting installer produced by scripts/build.sh.
srdb_pack_local: "{{ playbook_dir }}/../dist/srdb-install.sh"

# Public URL of the deployment (used as OAuth redirect base).
# Should match the Authorization callback URL registered in your GitHub OAuth App,
# minus the /auth/callback suffix.
srdb_base_url: "https://{{ srdb_domain }}"

# GitHub OAuth App credentials.
# github_client_id and github_client_secret should be set in secrets.yml (ansible-vault).
github_client_id: ""
github_client_secret: ""

# Sentry DSN for error reporting. Leave empty to disable.
# Set the real value in secrets.yml (ansible-vault).
sentry_dsn: ""
