---
- name: Create config directory for srdb user
  ansible.builtin.file:
    path: "/home/{{ srdb_service_user }}/.config/staged-recipe-dashboard"
    state: directory
    owner: "{{ srdb_service_user }}"
    group: "{{ srdb_service_group }}"
    mode: "0700"

- name: Write application config
  ansible.builtin.template:
    src: config.toml.j2
    dest: "/home/{{ srdb_service_user }}/.config/staged-recipe-dashboard/config.toml"
    owner: "{{ srdb_service_user }}"
    group: "{{ srdb_service_group }}"
    mode: "0600"
  no_log: true
