[project]
name = "staged-recipe-dashboard"
version = "0.1.0"
description = "Dashboard for conda-forge staged-recipe reviewers"
requires-python = ">=3.11"
dependencies = []  # managed by pixi; listed in recipe/meta.yaml for conda packaging

[project.scripts]
srdb = "staged_recipe_dashboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staged_recipe_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
